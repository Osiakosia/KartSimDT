[project]
name = "kartsimdt"
version = "0.1.0"
description = "KartSim Digital Twin Toolkit"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

authors = [
    { name = "Jokūbas Kupstas" }
]

keywords = [
    "karting",
    "digital-twin",
    "blender",
    "unity",
    "gps",
    "telemetry",
    "google-earth"
]

# ==========================================================
# Black
# ==========================================================

[tool.black]

line-length = 88

target-version = ["py313"]

# ==========================================================
# Ruff
# ==========================================================

[tool.ruff]

line-length = 88
target-version = "py313"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

ignore = [
]

# ==========================================================
# MyPy
# ==========================================================

[tool.mypy]

python_version = "3.13"

warn_return_any = true

warn_unused_configs = true

disallow_untyped_defs = true

check_untyped_defs = true

ignore_missing_imports = true

# ==========================================================
# Pytest
# ==========================================================

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]